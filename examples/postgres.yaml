# Paths are relative to this file. The URL belongs in a separate mode-0600 file.
database_driver: postgres
postgres_dsn_file: postgres.dsn
data_dir: postgres-data
master_key_file: master.key
admin_jwt_key_file: admin.jwt.key
admin_encryption_key_file: admin.encryption.key
admin_bootstrap_token_file: admin.setup
web_enabled: true
# Enable native HTTPS with web_tls_enabled and certificate/key paths.
web_tls_enabled: false
web_listen: 127.0.0.1:8081
web_public_url: http://127.0.0.1:8081
listen: 127.0.0.1:8080
public_url: http://127.0.0.1:8080
tool_timeout: 5m
shutdown_timeout: 45s
