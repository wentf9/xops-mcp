services:
  xops-mcp:
    build:
      context: ../..
    image: xops-mcp:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - xops-data:/var/lib/xops-mcp
      - ./container.yaml:/etc/xops-mcp/server.yaml:ro
      - type: bind
        source: ./.secrets
        target: /run/secrets/xops
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 60s
volumes:
  xops-data:
