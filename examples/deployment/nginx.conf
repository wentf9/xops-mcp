# MCP and file transfers use their own public origin and upstream listener.
server {
    listen 443 ssl;
    server_name mcp.example.com;
    ssl_certificate /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;

    client_max_body_size 10g;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 2h;
    proxy_send_timeout 2h;

    location = /mcp {
        proxy_pass http://127.0.0.1:8080;
    }
    location /v1/transfers/ {
        proxy_pass http://127.0.0.1:8080;
    }
    location / {
        return 404;
    }
}

# Matches web_public_url and web_base_path in systemd.yaml. Keep this virtual
# host on the management network or apply the deployment's access restrictions.
server {
    listen 443 ssl;
    server_name admin.example.com;
    ssl_certificate /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";

    location = /console {
        proxy_pass http://127.0.0.1:8081;
    }
    location /console/ {
        # No trailing slash: preserve the configured prefix for UI and API.
        proxy_pass http://127.0.0.1:8081;
    }
    location / {
        return 404;
    }
}
